name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-svg-dev libngspice0-dev \
            libtomlplusplus-dev libspdlog-dev nlohmann-json3-dev libsimdjson-dev \
            libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: Build
        env:
          OPENVLSI_ENABLE_OPENROAD: "0"
          OPENVLSI_BUILD_PYTHON: "0"
        run: |
          xmake f -y -m release
          xmake build -y openvlsi openvlsi-cli openvlsi-pkg openvlsi-mcp
      - name: Package
        env:
          OPENVLSI_ENABLE_OPENROAD: "0"
          OPENVLSI_BUILD_PYTHON: "0"
        run: xmake pack -f targz,zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: openvlsi-linux-x86_64
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            artifact: openvlsi-macos-arm64
          - runner: macos-26-intel
            arch: x86_64
            artifact: openvlsi-macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install libngspice tomlplusplus spdlog nlohmann-json openssl@3 curl zlib simdjson pkgconf dylibbundler
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.8.3 clang_64 -O "$HOME/Qt" --archives qtbase qtsvg
          qt_prefix="$HOME/Qt/6.8.3/macos"
          pkg_config_path="$(brew --prefix)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix openssl@3)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix curl)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix zlib)/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$pkg_config_path" >>"$GITHUB_ENV"
          echo "OPENVLSI_QT_PREFIX=$qt_prefix" >>"$GITHUB_ENV"
          echo "OPENVLSI_QT_BIN=$qt_prefix/bin" >>"$GITHUB_ENV"
      - name: Install xmake
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            asset=xmake-bundle-v3.1.2.macos.arm64
          else
            asset=xmake-bundle-v3.1.2.macos.x86_64
          fi
          mkdir -p "$RUNNER_TEMP/xmake-bin"
          curl -fsSL -o "$RUNNER_TEMP/xmake-bin/xmake" \
            "https://github.com/xmake-io/xmake/releases/download/v3.1.2/$asset"
          chmod +x "$RUNNER_TEMP/xmake-bin/xmake"
          echo "$RUNNER_TEMP/xmake-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/xmake-bin/xmake" --version
      - name: Build
        env:
          OPENVLSI_ENABLE_OPENROAD: "0"
          OPENVLSI_BUILD_PYTHON: "0"
        run: |
          xmake f -y -m release
          xmake build -y openvlsi openvlsi-cli openvlsi-pkg openvlsi-mcp
      - name: Package
        env:
          OPENVLSI_ENABLE_OPENROAD: "0"
          OPENVLSI_BUILD_PYTHON: "0"
        run: xmake pack -f zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  windows:
    name: Windows x86_64
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            pkgconf
            zip
            mingw-w64-ucrt-x86_64-xmake
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-simdjson
            mingw-w64-ucrt-x86_64-ntldd
      - name: Stage NSIS with UAC plugin
        shell: pwsh
        run: |
          $nsisRoot = Join-Path $env:RUNNER_TEMP "nsis"
          New-Item -ItemType Directory -Force -Path $nsisRoot | Out-Null
          Invoke-WebRequest -Uri "https://github.com/xmake-mirror/nsis/releases/download/v309/nsis-3.09.zip" -OutFile "$nsisRoot\nsis.zip"
          Expand-Archive -Path "$nsisRoot\nsis.zip" -DestinationPath $nsisRoot -Force
          $nsis = Join-Path $nsisRoot "nsis-3.09"
          Invoke-WebRequest -Uri "https://github.com/xmake-mirror/nsis/releases/download/v309/UAC.zip" -OutFile "$nsisRoot\uac.zip"
          Expand-Archive -Path "$nsisRoot\uac.zip" -DestinationPath "$nsisRoot\uac" -Force
          Copy-Item "$nsisRoot\uac\UAC.nsh" "$nsis\Include\UAC.nsh" -Force
          Copy-Item "$nsisRoot\uac\Plugins\x86-ansi\*.dll" "$nsis\Plugins\x86-ansi\" -Force
          Copy-Item "$nsisRoot\uac\Plugins\x86-unicode\*.dll" "$nsis\Plugins\x86-unicode\" -Force
          Invoke-WebRequest -Uri "https://github.com/xmake-mirror/nsis/releases/download/v309/nsis-3.09-strlen_8192.zip" -OutFile "$nsisRoot\strlen.zip"
          Expand-Archive -Path "$nsisRoot\strlen.zip" -DestinationPath $nsis -Force
      - name: Build and package
        shell: msys2 {0}
        run: |
          nsis_dir="$(cygpath -u "$RUNNER_TEMP")/nsis/nsis-3.09"
          export PATH="$nsis_dir/Bin:$nsis_dir:$PATH"
          export OPENVLSI_ENABLE_OPENROAD=0
          export OPENVLSI_BUILD_PYTHON=0
          export OPENVLSI_MINGW_SYSROOT="$(cygpath -w "$MINGW_PREFIX")"
          export OPENVLSI_PKG_CONFIG_DIR="$(cygpath -w "$MINGW_PREFIX/lib/pkgconfig")"
          export OPENVLSI_BASH="$(cygpath -w /usr/bin/bash.exe)"
          xmake f -p mingw -a x86_64 --toolchain=mingw --mingw="$(cygpath -w "$MINGW_PREFIX")" -y -m release
          xmake build -y openvlsi openvlsi-cli openvlsi-pkg openvlsi-mcp
          xmake pack -f nsis,zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: openvlsi-windows-x86_64
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
