name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-svg-dev libngspice0-dev \
            libtomlplusplus-dev libspdlog-dev nlohmann-json3-dev libsimdjson-dev \
            libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: Build
        env:
          ICE_ENABLE_OPENROAD: "0"
          ICE_BUILD_PYTHON: "0"
        run: |
          xmake f -y -m release
          xmake build -y ice ice-cli ice-pkg ice-mcp
      - name: Package
        env:
          ICE_ENABLE_OPENROAD: "0"
          ICE_BUILD_PYTHON: "0"
        run: xmake pack -f targz,zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ice-linux-x86_64
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            artifact: ice-macos-arm64
          - runner: macos-15-intel
            arch: x86_64
            artifact: ice-macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install libngspice tomlplusplus spdlog nlohmann-json openssl@3 curl zlib simdjson pkgconf dylibbundler
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.8.3 clang_64 -O "$HOME/Qt"
          qt_prefix="$HOME/Qt/6.8.3/clang_64"
          pkg_config_path="$qt_prefix/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix openssl@3)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix curl)/lib/pkgconfig"
          pkg_config_path="$pkg_config_path:$(brew --prefix zlib)/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$pkg_config_path" >>"$GITHUB_ENV"
          echo "ICE_QT_BIN=$qt_prefix/bin" >>"$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Build
        env:
          ICE_ENABLE_OPENROAD: "0"
          ICE_BUILD_PYTHON: "0"
        run: |
          xmake f -y -m release
          xmake build -y ice ice-cli ice-pkg ice-mcp
      - name: Package
        env:
          ICE_ENABLE_OPENROAD: "0"
          ICE_BUILD_PYTHON: "0"
        run: xmake pack -f zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  windows:
    name: Windows x86_64
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-xmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-simdjson
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-ntldd
      - name: Build and package
        shell: msys2 {0}
        env:
          ICE_ENABLE_OPENROAD: "0"
          ICE_BUILD_PYTHON: "0"
          ICE_PKG_CONFIG_DIR: C:\msys64\ucrt64\lib\pkgconfig
        run: |
          mingw_prefix="${MINGW_PREFIX:-/ucrt64}"
          xmake f -p mingw -a x86_64 --mingw="$(cygpath -w "$mingw_prefix")" -y -m release
          xmake build -y ice ice-cli ice-pkg ice-mcp
          xmake pack -f nsis,zip --autobuild=n -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ice-windows-x86_64
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
